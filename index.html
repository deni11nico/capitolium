    <!--
      Everything between these markers is rewritten per route by
      scripts/prerender.mjs, so a shared link to any page carries that page's
      own title, description and card rather than the home page's.

      Absolute URLs throughout: a crawler has no page to resolve a relative
      path against. Static rather than set by the app, because the crawlers
      that read them do not run JavaScript, so anything React sets arrives too
      late to be seen. What is here is the home page's set.
    -->
